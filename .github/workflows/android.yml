name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            cmake \
            ninja-build \
            pkg-config

      - name: Prepare SDK and NDK paths
        run: |
          mkdir -p android

          # make_deps.sh expects:
          # android/android-ndk/28.1.13356709
          ln -sfn "$ANDROID_SDK_ROOT/ndk" android/android-ndk

          # make.sh expects the SDK directly here
          ln -sfn "$ANDROID_SDK_ROOT" android/android-sdk

      - name: Make build scripts executable
        run: |
          chmod +x android/gradlew
          chmod +x android/make_deps.sh
          chmod +x android/make.sh

          # Make any other shell scripts executable if present
          find android -type f -name "*.sh" -exec chmod +x {} \;

          echo "Executable permissions:"
          ls -l android/gradlew
          ls -l android/make_deps.sh
          ls -l android/make.sh

      - name: Verify Android toolchain
        run: |
          java -version
          cmake --version
          ninja --version
          "$ANDROID_SDK_ROOT/platform-tools/adb" version
          test -d "$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          echo "NDK found:"
          ls "$ANDROID_SDK_ROOT/ndk/28.1.13356709"

      - name: Build native dependencies
        working-directory: android
        env:
          NDK_PATH: ./android-ndk
          SDK_PATH: ./android-sdk
          STK_NDK_VERSION: 28.1.13356709
          COMPILE_ARCH: aarch64
        run: |
          ./make_deps.sh aarch64

      - name: Build debug APK
        working-directory: android
        env:
          NDK_PATH: ./android-ndk
          SDK_PATH: ./android-sdk
          STK_NDK_VERSION: 28.1.13356709
          COMPILE_ARCH: aarch64
          BUILD_TYPE: debug
        run: |
          ./make.sh

      - name: Find generated APK
        run: |
          echo "Searching for APK..."
          find android/bin -type f -name "*.apk" -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kaslik-kart-rush-debug-arm64
          path: android/bin/*.apk
          if-no-files-found: error
