name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Android NDK 28.1.13356709
        run: |
          set -euo pipefail

          sdkmanager --install "ndk;28.1.13356709"

          NDK_DIR="$ANDROID_SDK_ROOT/ndk/28.1.13356709"

          if [ ! -d "$NDK_DIR" ]; then
            echo "ERROR: NDK was not installed at:"
            echo "$NDK_DIR"
            echo
            echo "Installed NDK versions:"
            ls -la "$ANDROID_SDK_ROOT/ndk" || true
            exit 1
          fi

          echo "NDK successfully installed:"
          echo "$NDK_DIR"

          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            imagemagick \
            cmake \
            ninja-build \
            pkg-config

      - name: Prepare SDK and NDK paths
        run: |
          set -euo pipefail

          mkdir -p android

          # Project expects android/android-ndk/28.1.13356709
          ln -sfn "$ANDROID_SDK_ROOT/ndk" android/android-ndk

          # Project expects the Android SDK here
          ln -sfn "$ANDROID_SDK_ROOT" android/android-sdk

          echo "android/android-ndk -> $(readlink android/android-ndk)"
          echo "android/android-sdk -> $(readlink android/android-sdk)"

          test -d "android/android-ndk/28.1.13356709"
          test -d "android/android-sdk/platforms/android-35"
          test -d "android/android-sdk/build-tools/35.0.0"

      - name: Make build scripts executable
        run: |
          set -euo pipefail

          chmod +x android/gradlew
          chmod +x android/make.sh
          chmod +x android/make_deps.sh

          find android -type f -name "*.sh" -exec chmod +x {} \;

          echo "gradlew:"
          ls -l android/gradlew

          echo "make.sh:"
          ls -l android/make.sh

          echo "make_deps.sh:"
          ls -l android/make_deps.sh

      - name: Verify Android toolchain
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "CMake:"
          cmake --version

          echo
          echo "Ninja:"
          ninja --version

          echo
          echo "ADB:"
          adb version

          echo
          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "NDK:"
          echo "$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK_HOME/source.properties"

          echo
          echo "NDK source.properties:"
          cat "$ANDROID_NDK_HOME/source.properties"

          echo
          echo "NDK Clang:"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build native dependencies
        working-directory: android
        env:
          NDK_PATH: ./android-ndk
          SDK_PATH: ./android-sdk
          STK_NDK_VERSION: 28.1.13356709
          COMPILE_ARCH: aarch64
        run: |
          set -euo pipefail
          ./make_deps.sh

      - name: Build debug APK
        working-directory: android
        env:
          NDK_PATH: ./android-ndk
          SDK_PATH: ./android-sdk
          STK_NDK_VERSION: 28.1.13356709
          COMPILE_ARCH: aarch64
          BUILD_TYPE: debug
        run: |
          set -euo pipefail
          ./make.sh

      - name: Find generated APK
        run: |
          set -euo pipefail

          echo "Searching for APK files..."

          find android/bin \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "Found $APK_COUNT APK file(s)."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kaslik-kart-rush-debug-arm64
          path: android/bin/*.apk
          if-no-files-found: error
