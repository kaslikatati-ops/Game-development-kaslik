name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK and NDK
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709"
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install host build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison flex libtool make \
            python3 python3-mako meson \
            imagemagick cmake ninja-build pkg-config \
            pngquant advancecomp libjpeg-progs optipng \
            vorbis-tools xz-utils unzip zip yasm

      - name: Download native dependency sources
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/lib"
          curl -fL --retry 5 \
            "https://github.com/supertuxkart/dependencies/releases/download/preview/dependencies-android-src.tar.xz" \
            -o /tmp/dependencies-android-src.tar.xz
          tar -xJf /tmp/dependencies-android-src.tar.xz -C "$GITHUB_WORKSPACE/lib"
          rm -f /tmp/dependencies-android-src.tar.xz
          for d in zlib libpng freetype harfbuzz openal mbedtls curl libjpeg libogg libvorbis; do
            test -d "$GITHUB_WORKSPACE/lib/$d" || { echo "ERROR: missing lib/$d"; exit 1; }
          done
          test -f "$GITHUB_WORKSPACE/lib/zlib/CMakeLists.txt"
          test -f "$GITHUB_WORKSPACE/lib/libpng/CMakeLists.txt"
          echo "Native dependency sources are ready."

      - name: Download Android game assets
        run: |
          set -e
          ASSET_DIR="$GITHUB_WORKSPACE/stk-assets"
          rm -rf "$ASSET_DIR"
          mkdir -p "$ASSET_DIR"
          echo "Downloading assets to: $ASSET_DIR"
          curl -fL --retry 5 \
            "https://github.com/supertuxkart/stk-assets-mobile/releases/download/git/stk-assets-full.zip" \
            -o /tmp/stk-assets-full.zip
          unzip -q /tmp/stk-assets-full.zip -d "$ASSET_DIR"
          rm -f /tmp/stk-assets-full.zip
          
          # Verify asset directories
          if [ ! -d "$ASSET_DIR/tracks" ]; then
            echo "ERROR: tracks directory not found at $ASSET_DIR/tracks"
            ls -la "$ASSET_DIR" || true
            exit 1
          fi
          if [ ! -d "$ASSET_DIR/karts" ]; then
            echo "ERROR: karts directory not found at $ASSET_DIR/karts"
            exit 1
          fi
          echo "Android game assets verified successfully."

      - name: Prepare SDK and NDK paths
        run: |
          set -e
          ln -sfn "$ANDROID_SDK_ROOT/ndk" android/android-ndk
          ln -sfn "$ANDROID_SDK_ROOT" android/android-sdk
          test -d android/android-ndk/28.1.13356709
          test -d android/android-sdk/platforms/android-35
          test -d android/android-sdk/build-tools/35.0.0

      - name: Make build scripts executable
        run: |
          set -e
          chmod +x android/gradlew android/make.sh android/make_deps.sh android/generate_assets.sh
          find android -type f -name "*.sh" -exec chmod +x {} \;

      - name: Verify Android toolchain
        run: |
          set -e
          java -version
          cmake --version
          ninja --version
          adb version
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version
          test -f android/../lib/zlib/CMakeLists.txt
          test -f android/../lib/libpng/CMakeLists.txt

      - name: Generate Android assets
        working-directory: android
        env:
          KARTS: all
          TRACKS: all
          DECREASE_QUALITY: "1"
          CONVERT_TO_JPG: "1"
          ASSETS_PATHS: "${{ github.workspace }}/stk-assets"
        run: |
          set -e
          echo "ASSETS_PATHS=$ASSETS_PATHS"
          ./generate_assets.sh

      - name: Build native dependencies
        working-directory: android
        env:
          NDK_PATH: ./android-ndk
          SDK_PATH: ./android-sdk
          STK_NDK_VERSION: 28.1.13356709
          COMPILE_ARCH: aarch64
        run: ./make_deps.sh

      - name: Build debug APK
        working-directory: android
        env:
          NDK_PATH: ./android-ndk
          SDK_PATH: ./android-sdk
          STK_NDK_VERSION: 28.1.13356709
          COMPILE_ARCH: aarch64
          BUILD_TYPE: debug
        run: ./make.sh

      - name: Find generated APK
        run: |
          set -e
          find android -type f -name "*.apk" -print
          APK_COUNT=$(find android -type f -name "*.apk" | wc -l)
          test "$APK_COUNT" -gt 0

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kaslik-kart-rush-debug-arm64
          path: android/bin/*.apk
          if-no-files-found: error
          
